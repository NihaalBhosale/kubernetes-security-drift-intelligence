apiVersion: v1
kind: Pod
metadata:
  name: demo-pod
  namespace: default
  labels:
    app: demo
spec:
  serviceAccountName: default
  containers:
    - name: demo
      image: nginx:1.27
      ports:
        - containerPort: 80
      securityContext:
        privileged: false
        runAsNonRoot: true
        allowPrivilegeEscalation: false
