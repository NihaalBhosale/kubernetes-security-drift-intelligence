  precision: 0.7
- if: ctx[X_CHAIN_TOKEN_OPEN] > 0.48 AND ctx[X_DEFAULT_SA_POWER] > 0.48 AND ctx[X_BIND_GROUP_BROADCAST]
    > 0.11 AND NEW[R_SA_EXEC] <= 0.50
